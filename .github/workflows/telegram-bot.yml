name: Telegram Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'

concurrency:
  group: gitdrive-telegram
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install httpx psycopg2-binary

      - name: Run bot (50 min shift)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DB_URL: ${{ secrets.GITDRIVE_DB_URL }}
          GITDRIVE_API_KEYS: ${{ secrets.GITDRIVE_API_KEYS }}
          BOT_ALLOW_CHAT_ID: ${{ secrets.BOT_ALLOW_CHAT_ID }}
          RUN_MINUTES: '50'
        run: |
          python scripts/telegram_bot.py &
          sleep 3000 && kill %1 || true

      - name: Chain next run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          for attempt in 1 2 3; do
            gh workflow run "Telegram Bot" --repo ${{ github.repository }} && exit 0
            sleep 10
          done
          exit 1
