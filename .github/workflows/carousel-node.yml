name: GridCarousel Node

on:
  workflow_dispatch:
    inputs:
      node_id:
        description: 'Carousel chain id (e.g. carousel-01)'
        required: true
        type: string
      run_minutes:
        description: 'Shift length in minutes (handoff starts 20 min before end)'
        required: false
        default: '340'
        type: string

# NO concurrency group here: the relay needs the old and new VM to overlap
# during the ~20 min handoff. Double-start protection lives in the DB
# (handoff claims are atomic).

permissions:
  actions: write
  contents: write

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install fastapi uvicorn httpx psycopg2-binary python-multipart

      - name: Prepare data dir
        run: mkdir -p /tmp/carousel-data

      - name: Start cloudflared tunnel
        run: |
          curl -sL --retry 3 https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          /tmp/cloudflared tunnel --url http://localhost:8080 > /tmp/tunnel.log 2>&1 &
          sleep 12

      - name: Export tunnel URL
        run: |
          echo "TUNNEL_URL=$(grep -oP 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/tunnel.log | head -1)" >> $GITHUB_ENV

      - name: Run carousel node
        env:
          DB_URL: ${{ secrets.GITDRIVE_DB_URL }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          STORAGE_REPO: ${{ secrets.GITDRIVE_STORAGE_REPO }}
          NODE_ID: ${{ inputs.node_id }}
          RELAY_TOKEN: ${{ secrets.RELAY_TOKEN }}
          DISK_BUDGET_MB: '13000'
          CHECKIN_MIN: '20'
        run: python scripts/carousel.py --run-min ${{ inputs.run_minutes }}

      - name: Self-heal dispatch (if handoff never happened)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          gh workflow run "GridCarousel Node" --repo ${{ github.repository }} \
            -f node_id=${{ inputs.node_id }} -f run_minutes=${{ inputs.run_minutes }}
